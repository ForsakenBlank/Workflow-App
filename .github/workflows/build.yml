name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk atlas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-apk
          path: atlas.apk

      # main always has a downloadable build at the "latest" release
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest atlas.apk \
            --title "Atlas latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap atlas.apk to install." \
            --prerelease
